name: 'Terraform Infrastructure'

on:
  push:
    branches: [ "new-feature-branch" ]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "ap-south-1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent hanging workflows
    
    # Working directory for all terraform commands
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
    # Checkout the repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Setup Terraform with specified version
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    # Configure AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Initialize Terraform with S3 backend
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.S3_BACKEND_BUCKET }}" \
          -backend-config="dynamodb_table=${{ secrets.DYNAMODB_LOCK_TABLE }}" \
          -backend-config="region=${{ env.AWS_REGION }}"
      env:
        TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
        TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
        TF_VAR_app_s3_bucket_name: ${{ secrets.APP_S3_BUCKET_NAME }}
        TF_VAR_app_s3_prefix: ${{ secrets.APP_S3_PREFIX }}
        TF_VAR_share_token_key: ${{ secrets.SHARE_TOKEN_KEY }}

    # Validate Terraform configuration
    - name: Terraform Validate
      run: terraform validate

    # Check Terraform formatting
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      continue-on-error: true

    # Check for stale locks and clear if needed
    - name: Check State Lock Status
      run: |
        echo "Checking for potential state locks..."
        if ! terraform plan -input=false -lock-timeout=30s >/dev/null 2>&1; then
          echo "⚠️ State appears to be locked. This might be a stale lock from a previous run."
          echo "Attempting to diagnose the issue..."
          # Don't auto-unlock in CI for safety, just report the issue
          echo "If this persists, a manual 'terraform force-unlock' may be needed."
          exit 1
        fi
        echo "✅ State lock check passed"
      env:
        TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
        TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
        TF_VAR_app_s3_bucket_name: ${{ secrets.APP_S3_BUCKET_NAME }}
        TF_VAR_app_s3_prefix: ${{ secrets.APP_S3_PREFIX }}
        TF_VAR_share_token_key: ${{ secrets.SHARE_TOKEN_KEY }}

    # Generate Terraform plan 
    - name: Terraform Plan
      run: |
        terraform plan -input=false -lock-timeout=5m
        echo "📋 Terraform plan completed"
      env:
        TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
        TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
        TF_VAR_app_s3_bucket_name: ${{ secrets.APP_S3_BUCKET_NAME }}
        TF_VAR_app_s3_prefix: ${{ secrets.APP_S3_PREFIX }}
        TF_VAR_share_token_key: ${{ secrets.SHARE_TOKEN_KEY }}

    # Apply Terraform changes and detect if changes were made
    - name: Terraform Apply
      id: apply
      run: |
        echo "🚀 Running terraform apply..."
        
        # Capture apply output to detect changes
        terraform apply -auto-approve -input=false -lock-timeout=5m | tee apply_output.txt
        
        # Check if any resources were changed
        if grep -q "Apply complete! Resources:" apply_output.txt; then
          # Extract the change summary
          changes_line=$(grep "Apply complete! Resources:" apply_output.txt)
          echo "apply_changes=true" >> $GITHUB_OUTPUT
          echo "📦 Terraform made changes: $changes_line"
        else
          echo "apply_changes=false" >> $GITHUB_OUTPUT
          echo "✅ No infrastructure changes were needed"
        fi
        
        # Clean up
        rm -f apply_output.txt
      env:
        TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
        TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
        TF_VAR_app_s3_bucket_name: ${{ secrets.APP_S3_BUCKET_NAME }}
        TF_VAR_app_s3_prefix: ${{ secrets.APP_S3_PREFIX }}
        TF_VAR_share_token_key: ${{ secrets.SHARE_TOKEN_KEY }}

    # Get EC2 instance ID for post-deployment verification
    - name: Get EC2 Instance ID
      if: always()
      id: instance
      run: |
        set -e
        
        # Try to get instance ID from terraform output first
        echo "🔍 Attempting to get instance ID from terraform output..."
        if INSTANCE_ID=$(terraform output -raw ec2_instance_id 2>/dev/null) && [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "null" ]; then
          echo "✅ Found instance ID from terraform output: $INSTANCE_ID"
        else
          echo "⚠️ Terraform output not available, searching by tags..."
          # Fallback to finding instance by tag
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cv-generator*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ] || [ "$INSTANCE_ID" == "null" ]; then
            echo "❌ Could not find EC2 instance to reboot"
            exit 1
          fi
          echo "✅ Found instance ID by tag: $INSTANCE_ID"
        fi
        
        # Validate instance ID format
        if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
          echo "❌ Invalid instance ID format: $INSTANCE_ID"
          exit 1
        fi
        
        # Clean output for GitHub Actions
        echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
        echo "Found EC2 instance: $INSTANCE_ID"
      env:
        TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
        TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_API_KEY }}
        TF_VAR_app_s3_bucket_name: ${{ secrets.APP_S3_BUCKET_NAME }}
        TF_VAR_app_s3_prefix: ${{ secrets.APP_S3_PREFIX }}
        TF_VAR_share_token_key: ${{ secrets.SHARE_TOKEN_KEY }}

    # Reboot EC2 instance (only if terraform didn't make changes)
    - name: Reboot EC2 Instance
      if: steps.apply.outputs.apply_changes == 'false' && steps.instance.outputs.instance_id != ''
      run: |
        echo "🔄 No terraform changes were made, rebooting EC2 instance to refresh application"
        echo "🔄 Rebooting EC2 instance: ${{ steps.instance.outputs.instance_id }}"
        aws ec2 reboot-instances --instance-ids ${{ steps.instance.outputs.instance_id }}
        echo "✅ Reboot command sent successfully"

    # Wait for instance to be running (after terraform changes OR reboot)
    - name: Wait for Instance to be Running
      if: steps.instance.outputs.instance_id != ''
      run: |
        if [ "${{ steps.apply.outputs.apply_changes }}" == "true" ]; then
          echo "⏳ Waiting for instance to be running after terraform changes..."
        else
          echo "⏳ Waiting for instance to complete reboot and become running..."
        fi
        aws ec2 wait instance-running --instance-ids ${{ steps.instance.outputs.instance_id }}
        echo "✅ Instance is now running"

    # Wait for instance to pass status checks
    - name: Wait for Instance Status Checks
      if: steps.instance.outputs.instance_id != ''
      run: |
        echo "⏳ Waiting for instance to pass status checks..."
        aws ec2 wait instance-status-ok --instance-ids ${{ steps.instance.outputs.instance_id }}
        echo "✅ Instance has passed all status checks and is ready"

    # Summary step
    - name: Deployment Summary
      run: |
        if [ "${{ steps.apply.outputs.apply_changes }}" == "true" ]; then
          echo "📦 Terraform made infrastructure changes - instance was updated"
        else
          echo "🔄 No terraform changes needed - EC2 instance was rebooted to refresh application"
        fi
        echo "🚀 Deployment completed successfully" 