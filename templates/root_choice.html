<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | CV Generator</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 80vh; margin: 0; }
    .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; max-width: 520px; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { margin: 0 0 8px 0; font-size: 22px; }
    p { margin: 0 0 20px 0; color: #555; }
    .btn { display: inline-block; border: none; background: #4C5196; color: #fff; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin-right: 12px; }
    .btn.secondary { background: #6c757d; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .hint { font-size: 12px; color: #666; margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; }
    .small-spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); border-top-color: #4C5196; animation: spin 1s linear infinite; }
    #global-progress-bar { position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: linear-gradient(90deg, #4C5196, #6f74c9); box-shadow: 0 0 8px rgba(76,81,150,0.3); z-index: 99998; transition: width 0.2s ease-out, opacity 0.3s ease; opacity: 0; }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
  </style>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/?new=1" />
  </noscript>
</head>
<body>
  <div id="global-progress-bar"></div>
  <div class="card">
    <h1>Welcome to CV Generator</h1>
    <p>Pick an option to get started.</p>
    <div class="actions">
      <button id="continueBtn" class="btn" disabled>Continue where you left off</button>
      <button id="newBtn" class="btn secondary">Start a new resume</button>
    </div>
    <div id="hint" class="hint"></div>
  </div>

  <script>
    (function () {
      var continueBtn = document.getElementById('continueBtn');
      var newBtn = document.getElementById('newBtn');
      var hint = document.getElementById('hint');

      function getLastResume() {
        try {
          var id = localStorage.getItem('lastResumeId');
          var ts = localStorage.getItem('lastResumeTimestamp');
          if (!id || !ts) return null;
          var age = Date.now() - Number(ts);
          if (isNaN(age)) return id;
          if (age < 7 * 24 * 60 * 60 * 1000) return id;
        } catch (e) { /* ignore */ }
        return null;
      }

      var lastId = getLastResume();
      if (lastId) {
        // Validate with server before enabling continue button
        try {
          hint.innerHTML = '<span class="small-spinner"></span> Checking your last resume...';
          startGlobalProgress();
          fetch('/api/v1/resume/' + encodeURIComponent(lastId) + '/exists', { cache: 'no-store' })
            .then(function(resp) { return resp.json(); })
            .then(function(json) {
              if (json && json.exists) {
                continueBtn.disabled = false;
                hint.textContent = '';
              } else {
                // Clear invalid localStorage and start new
                try {
                  localStorage.removeItem('lastResumeId');
                  localStorage.removeItem('lastResumeTimestamp');
                } catch (e) { /* ignore */ }
                window.location.replace('/?new=1');
              }
              endGlobalProgress();
            })
            .catch(function() {
              // On network error, fallback to new to avoid a broken continue flow
              failGlobalProgress();
              window.location.replace('/?new=1');
            });
        } catch (e) {
          failGlobalProgress();
          window.location.replace('/?new=1');
        }
      } else {
        // If nothing is found, skip UI and go straight to new
        window.location.replace('/?new=1');
        return;
      }

      continueBtn.addEventListener('click', function () {
        if (!lastId) return;
        window.location.href = '/?resume_id=' + encodeURIComponent(lastId);
      });
      newBtn.addEventListener('click', function () {
        window.location.href = '/?new=1';
      });

      function startGlobalProgress() {
        var bar = document.getElementById('global-progress-bar');
        if (!bar) return; bar.style.opacity = '1'; bar.style.width = '0%';
        requestAnimationFrame(function(){ bar.style.width = '30%'; setTimeout(function(){ bar.style.width = '70%'; }, 200); });
      }
      function endGlobalProgress() {
        var bar = document.getElementById('global-progress-bar');
        if (!bar) return; bar.style.width = '100%'; setTimeout(function(){ bar.style.opacity = '0'; setTimeout(function(){ bar.style.width = '0%'; }, 300); }, 150);
      }
      function failGlobalProgress() {
        var bar = document.getElementById('global-progress-bar');
        if (!bar) return; var original = bar.style.background; bar.style.background = 'linear-gradient(90deg, #e11d48, #fb7185)'; bar.style.width = '100%'; setTimeout(function(){ bar.style.opacity = '0'; setTimeout(function(){ bar.style.width = '0%'; bar.style.background = original || 'linear-gradient(90deg, #4C5196, #6f74c9)'; }, 300); }, 200);
      }
    })();
  </script>
</body>
</html>
